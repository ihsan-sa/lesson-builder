<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <!-- Defence in depth behind _lesson-core/chat/safeRender.js: no plugins, no
       frames, no <base> or form hijack from anything a chat reply could inject.
       Script/style/img sources stay open because Vite dev, KaTeX, Desmos and
       GeoGebra (CDN + inline) need them. GeoGebra's loader also runs in one
       about:blank iframe, which frame-src 'none' does not block. -->
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>__COURSE_CODE__ - __LESSON_TITLE__</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
